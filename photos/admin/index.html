<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แดชบอร์ดรูปรายงาน ว.14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#18202b; --muted:#667085; --line:#e3e7ee;
  --brand:#1f4e79; --brand-2:#e8f0f8; --ok:#16794c; --ok-bg:#e5f5ec; --part:#c98a0b; --part-bg:#fdf3dc;
  --none:#d0d6df; --err:#b42318; --err-bg:#fdecea;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--brand);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:19px;margin:0;flex:1;min-width:220px}
header small{display:block;font-weight:400;opacity:.8;font-size:13px}
.sw{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:10px;font-size:14px;cursor:pointer;user-select:none}
.sw input{width:40px;height:22px;appearance:none;background:#8aa2bb;border-radius:22px;position:relative;cursor:pointer;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:#3cc47c}
.sw input:checked::after{left:21px}
main{max-width:1200px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.tools input,.tools select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.tools input{flex:1;min-width:160px}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.btn.ghost{background:var(--brand-2);color:var(--brand)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.bulk .n{flex:1;min-width:140px;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:#f8fafc;position:sticky;top:0;cursor:pointer;white-space:nowrap}
tr.r{cursor:pointer}
tr.r:hover td{background:#f8fbff}
td.code{font-weight:700;white-space:nowrap}
td .sub{color:var(--muted);font-size:13px}
.dots{display:flex;gap:4px}
.dot{width:24px;height:24px;border-radius:6px;background:#eef1f5;color:#9aa4b2;font-size:11px;font-weight:700;display:grid;place-items:center}
.dot.y{background:var(--ok);color:#fff}
.pill{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.part{background:var(--part-bg);color:var(--part)}
.pill.none{background:#eef1f5;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.pill.rv-ok{background:var(--ok);color:#fff}.pill.rv-fix{background:var(--err-bg);color:var(--err)}.pill.rv-incomplete{background:var(--part-bg);color:var(--part)}.pill.rv-new{background:#e6effa;color:var(--brand)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs button{border:1px solid var(--line,#d8dee6);background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs button b{font-weight:700;margin-left:4px}
.rv{border:2px solid var(--brand-2);border-radius:12px;padding:10px 12px;background:#f7faff}
.rv textarea{width:100%;min-height:54px;font:inherit;font-size:14px;border:1px solid #cfd7e2;border-radius:8px;padding:6px 8px;margin:6px 0}
.rv .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn.rv-ok{background:var(--ok);color:#fff}.btn.rv-fix{background:var(--err);color:#fff}.btn.rv-incomplete{background:var(--part);color:#fff}
.lockbar{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:8px 10px;font-weight:600;margin-top:8px}
.role{background:#fff;color:var(--brand);border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700}
.dl label{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #eef1f5;font-size:15px;cursor:pointer}
.dl label input{width:18px;height:18px}
.chk{width:18px;height:18px}
.drawer{position:fixed;inset:0;background:rgba(10,20,35,.45);display:none;z-index:20}
.drawer.on{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);overflow:auto;padding:0 0 30px}
.panel .top{position:sticky;top:0;background:var(--brand);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;z-index:1}
.panel .top h2{margin:0;font-size:17px;flex:1}
.panel .top h2 small{display:block;font-weight:400;font-size:13px;opacity:.85}
.panel .x{background:rgba(255,255,255,.15);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 12px;padding:10px 12px}
.sec h3{margin:0 0 6px;font-size:15px}
.rhint{font-size:12.5px;margin:-2px 0 6px}.rhint.warn{color:var(--err);font-weight:600}.rhint.ok{color:var(--ok)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px;font-size:14px}
.kv span{color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#e9edf2}
.th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.th.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed var(--line);background:#f7f9fb;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}
.th.add b{font-size:22px;line-height:1}
.th.add:disabled{cursor:progress;opacity:.7}
.form .grp{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);font-weight:600;font-size:14px}
.th .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 5px}
.movebar.on{border-color:var(--brand-2);background:#f7faff}
.sec.dz.over{outline:3px dashed var(--brand);background:#eef5ff}
.th.mv{outline:2px dashed #9fb3c8;cursor:grab}
.th.mv img{cursor:pointer}
.th.sel{outline:4px solid var(--brand)}
.th.sel::after{content:'เลือกแล้ว';position:absolute;top:4px;left:4px;background:var(--brand);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.dropbtn{display:block;width:100%;margin:2px 0 8px;padding:9px;border:2px dashed var(--brand-2);border-radius:8px;background:#fff;color:var(--brand);font:inherit;font-weight:600;cursor:pointer}
.dropbtn:disabled{border-color:var(--line);color:var(--muted);cursor:default;font-weight:400}
.th .del{position:absolute;top:3px;right:3px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
.empty{color:var(--muted);font-size:13px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:40;flex-direction:column}
.viewer.on{display:flex}
.viewer img{max-width:96%;max-height:86vh}
.viewer p{color:#ddd;font-size:13px;margin:8px}
.viewer button{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:16px;width:min(440px,100%)}
.modal h3{margin:0 0 8px}
.pbar{height:10px;border-radius:10px;background:#e6ebf1;overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.log{font-size:13px;color:var(--muted);max-height:140px;overflow:auto}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:10px}
.msg.err{background:var(--err-bg);color:var(--err)}
.demo{background:#fff4cc;color:#6b5200;font-size:13px;text-align:center;padding:6px}
.form{position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.form .box{background:#fff;border-radius:14px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto}
.form h3{margin:0 0 4px}
.form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.form input,.form textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;box-sizing:border-box}
.form textarea{resize:vertical;line-height:1.5}
.form .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.key label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
.form .pv{width:min(920px,100%);height:92vh;display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pv iframe{flex:1;width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#e9edf2}
.key{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.key input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;margin:8px 0}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  table{border:0;background:none}
  tr.r{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:8px 10px;display:grid;grid-template-columns:24px 1fr auto;gap:4px 8px;align-items:center}
  tr.r td{border:0;padding:0}
  td.c-chk{grid-row:1}
  td.c-name{grid-column:2/4}
  td.c-dots{grid-column:2/3}
  td.c-st{grid-column:3/4;text-align:right}
  td.c-pdf,td.c-last{display:none}
}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>โหมดตัวอย่าง: ยังไม่ได้ตั้งค่า API_URL ใน photos/config.js</div>
<div id="app"></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="panel" id="panel"></div></div>
<div class="viewer" id="viewer"><button onclick="closeViewer()" aria-label="ปิด">✕</button><img id="vImg" alt=""><p id="vCap"></p></div>
<div class="modal" id="modal"><div class="box"><h3 id="mTitle">กำลังส่งออก PDF</h3>
  <div id="mText" class="empty"></div><div class="pbar"><i id="mBar"></i></div><div class="log" id="mLog"></div>
  <div style="text-align:right;margin-top:10px"><button class="btn ghost" id="mBtn" onclick="cancelExport()">ยกเลิก</button></div></div></div>

<script>
const CFG = window.PHOTO_CONFIG || {};
const DEMO = !CFG.API_URL && (/^(localhost|127\.)/.test(location.hostname) || location.protocol === 'file:' || new URLSearchParams(location.search).has('demo'));
const NOT_READY = !CFG.API_URL && !DEMO;
const qs = new URLSearchParams(location.search);
let KEY = store('get', 'w14p_admin_session') || '';
if (qs.has('key')) history.replaceState(null, '', location.pathname);
if (!/^[sS]\.\d+\./.test(KEY) || Number(KEY.split('.')[1]) < Date.now()) KEY = '';
const S = { districts: [], steps: [], exportOpen: false, sel: new Set(), q: '', region: '', status: '', sort: 'code', cur: null, cancel: false, tab: 'queue', role: 'admin' };

function store(op, k, v) { try { return op === 'get' ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function th(t) { if (!t) return ''; const d = new Date(t); return isNaN(d) ? t : d.toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }

async function api(action, data, post) {
  if (DEMO) return demoApi(action, data || {});
  const base = Object.assign({ action, key: KEY }, data || {});
  const res = post
    ? await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(base) })
    : await fetch(CFG.API_URL + '?' + new URLSearchParams(base));
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}

/* ---------- เริ่ม ---------- */
if (DEMO) document.getElementById('demo').hidden = false;
if (NOT_READY) document.getElementById('app').innerHTML = '<main><div class="msg err">ยังไม่ได้ใส่ API_URL ใน photos/config.js</div></main>';
else if (!KEY && !DEMO) askKey(); else load();
setInterval(() => { if (!document.hidden && !S.busy && S.districts.length) load(true); }, 60000);

function askKey(err) {
  document.getElementById('app').innerHTML = `<form class="key" id="loginForm"><h3 style="margin:0">เข้าสู่ระบบหลังบ้าน</h3>
    <div class="empty">แดชบอร์ดรูปรายงานประจำเขต ว.14</div>
    ${err ? '<div class="msg err" style="margin-top:10px">' + esc(err) + '</div>' : ''}
    <label for="lu">ชื่อผู้ใช้</label><input id="lu" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="lp">รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="lb" style="width:100%;margin-top:6px">เข้าสู่ระบบ</button></form>`;
  document.getElementById('lu').focus();
  document.getElementById('loginForm').onsubmit = async ev => {
    ev.preventDefault();
    const b = document.getElementById('lb'); b.disabled = true; b.textContent = 'กำลังตรวจสอบ…';
    try {
      const j = await api('login', { user: document.getElementById('lu').value.trim(), pass: document.getElementById('lp').value }, true);
      KEY = j.session; store('set', 'w14p_admin_session', KEY); load();
    } catch (e) { askKey(e.message); }
  };
}
function logout() { KEY = ''; try { localStorage.removeItem('w14p_admin_session'); } catch (e) { } askKey(); }

async function load(quiet) {
  try {
    const j = await api('admin_summary');
    S.districts = j.districts; S.role = j.role || 'admin'; S.steps = j.steps; S.exportOpen = j.exportOpen; S.max = j.maxPerStep || 3; S.pdfTitle = j.pdfTitle || '';
    if (!quiet || !document.getElementById('list')) shell();
    renderList();
  } catch (e) {
    if (/รหัสแอดมิน|เข้าสู่ระบบ/.test(e.message)) { KEY = ''; return askKey('กรุณาเข้าสู่ระบบอีกครั้ง'); }
    if (!quiet) document.getElementById('app').innerHTML = '<main><div class="msg err">' + esc(e.message) + '</div></main>';
  }
}

function nDone(d) { return S.steps.filter(s => (d.counts[s.n] || 0) > 0).length; }
function nPhotos(d) { return Object.values(d.counts).reduce((a, b) => a + b, 0); }
function statusOf(d) { const n = nDone(d); return n === S.steps.length ? 'ok' : (n ? 'part' : 'none'); }

function shell() {
  const regions = [...new Set(S.districts.map(d => d.region).filter(Boolean))].sort();
  document.getElementById('app').innerHTML = `
  <header><h1>แดชบอร์ดรูปรายงานประจำเขต<small>ว.14 ครูผู้ช่วย · แยกจากแดชบอร์ดรถ</small></h1>
    <span class="role">${S.role === 'super' ? 'ผู้ตรวจ (super-admin)' : 'แอดมิน'}</span>
    <label class="sw" title="เปิดแล้วผู้ประสานงานทุกเขตดาวน์โหลด PDF ของเขตตัวเองได้"><input type="checkbox" id="swOpen" ${S.exportOpen ? 'checked' : ''} onchange="setOpen(this)">อนุญาตให้ทุกเขตส่งออก PDF</label>
    <button class="btn ghost sm" onclick="logout()">ออกจากระบบ</button></header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <input id="q" placeholder="ค้นหา รหัส / เขต / สนามสอบ / ผู้ประสานงาน" value="${esc(S.q)}" oninput="S.q=this.value;renderList()">
      <select onchange="S.region=this.value;renderList()"><option value="">ทุกสายภูมิภาค</option>${regions.map(r => `<option ${S.region === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
      <select onchange="S.status=this.value;renderList()">
        <option value="">ทุกสถานะ</option><option value="ok">ครบทุกขั้น</option><option value="part">ส่งบางขั้น</option>
        <option value="none">ยังไม่ส่งเลย</option><option value="sub">ยืนยันส่งครบแล้ว</option></select>
      <button class="btn ghost" onclick="load()">รีเฟรช</button>
      <button class="btn ghost" onclick="editSteps()">แก้ข้อความหัวข้อ / PDF</button>
      <button class="btn ghost" style="color:var(--err)" onclick="resetAll()">ล้างข้อมูลทั้งหมด</button>
      <button class="btn ghost" onclick="importVenues()">นำเข้ารายชื่อสนามสอบ (CSV)</button>
      <button class="btn ghost" onclick="exportLinks()">ลิงก์ประจำเขต (CSV)</button>
    </div>
    <div class="bulk"><span class="n" id="selN"></span>
      <button class="btn ghost sm" onclick="selectShown()">เลือกทั้งหมดที่แสดง</button>
      <button class="btn ghost sm" onclick="S.sel.clear();renderList()">ล้างที่เลือก</button>
      <button class="btn sm" id="bMerge" onclick="exportPdf('merge')">ส่งออก PDF รวมไฟล์เดียว</button>
      <button class="btn sm" id="bZip" onclick="exportPdf('zip')">ส่งออกแยกสนาม (ZIP)</button></div>
    <table><thead><tr><th style="width:30px"></th><th onclick="sortBy('code')">เขต / สนามสอบ</th>
      <th>ขั้น 2–7</th><th onclick="sortBy('status')">สถานะ</th><th onclick="sortBy('last')">ส่งล่าสุด</th><th>อนุญาต PDF</th></tr></thead>
      <tbody id="list"></tbody></table>
  </main>`;
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  let list = S.districts.filter(d => {
    if (S.region && d.region !== S.region) return false;
    if (S.tab !== 'all' && reviewTab(d) !== S.tab) return false;
    if (S.status === 'sub') { if (!d.submittedAt) return false; }
    else if (S.status && statusOf(d) !== S.status) return false;
    if (q && ![d.code, d.name, d.venue, d.place].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  const by = { code: (a, b) => a.code.localeCompare(b.code), status: (a, b) => nDone(a) - nDone(b) || a.code.localeCompare(b.code),
    last: (a, b) => (b.lastPhoto || '').localeCompare(a.lastPhoto || '') };
  return list.sort(by[S.sort]);
}
function sortBy(k) { S.sort = k; renderList(); }

function renderList() {
  const all = S.districts;
  const ok = all.filter(d => statusOf(d) === 'ok').length, part = all.filter(d => statusOf(d) === 'part').length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${ok}/${all.length}</b><span>เขตส่งครบ ${S.steps.length} ขั้น</span></div>
     <div class="stat"><b>${part}</b><span>ส่งบางขั้น</span></div>
     <div class="stat"><b>${all.length - ok - part}</b><span>ยังไม่ส่งเลย</span></div>

      <td class="c-name"><span class="code">${esc(d.code)}</span> ${esc(d.name)}<div class="sub">${esc(d.venue || 'ยังไม่เลือกสนามสอบ')}${d.owners && d.owners.length ? ' · ' + esc(d.owners.join(', ')) : ''}${d.vehicle ? ' · คัน ' + esc(d.vehicle) : ''}</div></td>

      <td class="c-st"><span class="pill ${st}">${st === 'ok' ? 'ครบ' : n + '/' + S.steps.length}</span>${d.submittedAt ? ' <span class="pill ok" title="ผู้ประสานงานยืนยันส่งครบ">ยืนยัน</span>' : ''}${reviewPill(d)}</td>
      <td class="c-last"><span class="sub">${esc(th(d.lastPhoto)) || '-'}</span></td>

  }).join('') || '<tr><td colspan="6" class="empty">ไม่พบเขตตามเงื่อนไข</td></tr>';
  document.getElementById('selN').textContent = S.sel.size ? `เลือก ${S.sel.size} สนาม` : `แสดง ${list.length} สนาม · ติ๊กเลือกสนามเพื่อส่งออก`;
  document.getElementById('bMerge').disabled = document.getElementById('bZip').disabled = !S.sel.size;

/* เลือกส่งออกรายสนาม (เขตเดียวมีได้หลายสนาม): คีย์ = รหัส|สนาม */

function toggleSel(k, on) { k = decodeURIComponent(k); on ? S.sel.add(k) : S.sel.delete(k); renderList(); }

/* ---------- รายละเอียดเขต ---------- */
async function openDistrict(code, venueEnc) {
  const venue = decodeURIComponent(venueEnc || '');
  const d = S.districts.find(x => x.code === code && String(x.venue || '').trim() === venue.trim()) || S.districts.find(x => x.code === code);
  S.cur = { code, venue, photos: null, gen: 0 }; S.moveMode = false; S.moveSel = null;
  const cur = S.cur;
  const panel = document.getElementById('panel');
  document.getElementById('drawer').classList.add('on');
  const cached = PCACHE[code + '|' + venue];
  if (cached) { cur.dj = cached.dj; cur.photos = cached.photos.slice(); panel.innerHTML = drawerHtml(cur.dj, cur.photos); }
  else panel.innerHTML = drawerHtml(d, null);
  const gen = cur.gen;
  try {
    // ส่งสนามที่เลือกไปด้วย เพื่อให้ได้รูปเฉพาะสนามนั้น (ไม่รวมสนามอื่นของเขตเดียวกัน)
    const j = await api('admin_photos', { d: code, v: venue });
    // ระหว่างรอ มีการลบ/เพิ่มรูปในหน้านี้แล้ว: ไม่เอาข้อมูลเก่ามาทับ
    if (S.cur !== cur || cur.gen !== gen) return;
    cur.photos = j.photos;
    cur.dj = Object.assign({}, j.district, { venue: d ? d.venue : j.district.venue, venues: d ? d.venues : j.district.venues });
    redrawDrawer();
  } catch (e) { panel.insertAdjacentHTML('beforeend', '<div class="sec msg err">' + esc(e.message) + '</div>'); }
}
function drawerHtml(d, photos) {
  let h = `<div class="top"><h2>${esc(d.code)} ${esc(d.name)}<small>${esc(d.region || '')}${d.vehicle ? ' · คันที่ ' + esc(d.vehicle) : ''}</small></h2>

    <div class="sec"><h3>1. ข้อมูลเขต</h3><div class="kv">
      <span>สนามสอบ</span><div>${esc(d.venue || '-')}</div>
      <span>รายชื่อให้เลือก</span><div>${d.venues && d.venues.length ? esc(d.venues.join(' · ')) : '<span style="color:var(--err)">ยังไม่มี · นำเข้า CSV ก่อน</span>'}</div>
      <span>กรอกโดย</span><div>${esc(d.infoBy || '-')} ${d.infoTime ? '· ' + esc(th(d.infoTime)) : ''}</div>
      <span>ยืนยันส่งครบ</span><div>${d.submittedAt ? esc(th(d.submittedAt)) : '-'}</div>
      <span>ผู้ดูแล (ไลน์)</span><div>${d.owners && d.owners.length ? esc(d.owners.join(', ')) + ` <button class="btn ghost sm" onclick="resetOwners('${esc(d.code)}')">ล้าง</button>` : '-'}</div></div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost sm" onclick="previewPdf('${esc(d.code)}')">ดูตัวอย่าง PDF</button>

  const canEdit = !d.locked || S.role === 'super';
  // โหมดย้ายรูป: ลากรูปข้ามขั้น (คอมพิวเตอร์) หรือแตะรูปแล้วแตะ "ย้ายมาขั้นนี้" (มือถือ)
  const mv = !!(canEdit && S.moveMode && photos);
  const max = S.max || 3;
  if (canEdit && photos && photos.length) h += `<div class="sec movebar${mv ? ' on' : ''}"><button class="btn sm${mv ? '' : ' ghost'}" onclick="toggleMove()">${mv ? '✓ เสร็จแล้ว ออกจากโหมดย้ายรูป' : '↕ โหมดย้ายรูป (รูปอยู่ผิดขั้น)'}</button>` +
    (mv ? '<div class="empty" style="margin-top:6px">คอมพิวเตอร์: ลากรูปไปวางในขั้นที่ถูกต้อง · มือถือ: แตะรูปที่จะย้าย แล้วแตะ "ย้ายมาขั้นนี้" ในขั้นปลายทาง</div>' : '') + '</div>';
  const sel = mv && S.moveSel ? photos.find(p => p.id === S.moveSel) || null : null;
  for (const s of S.steps) {
    const list = photos ? photos.filter(p => p.step === s.n) : null;
    const add = canEdit && !mv && list && list.length < max
      ? `<button class="th add" onclick="adminPick(${s.n}, this)"><b>＋</b>เพิ่มรูป</button>` : '';
    const full = !!(list && list.length >= max);
    const target = mv ? `<button class="dropbtn" ${(!sel || sel.step === s.n || full) ? 'disabled' : ''} onclick="moveSelTo(${s.n})">${!sel ? 'แตะรูปที่จะย้ายก่อน' : sel.step === s.n ? 'รูปที่เลือกอยู่ขั้นนี้' : full ? 'ขั้นนี้มีรูปครบ ' + max + ' รูปแล้ว' : '⬇ ย้ายมาขั้นนี้'}</button>` : '';
    h += `<div class="sec${mv ? ' dz' : ''}"${mv ? ` ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event, ${s.n})"` : ''}><h3>${s.n}. ${esc(s.full || s.title)}</h3>` + (list === null || mv ? '' : reportHint(s.n, list.length)) + target + (list === null ? '<div class="empty">กำลังโหลด…</div>'
      : '<div class="thumbs">' + list.map(p => `<div class="th${mv ? ' mv' : ''}${mv && S.moveSel === p.id ? ' sel' : ''}"${mv ? ` draggable="true" ondragstart="dzStart(event,'${p.id}')"` : ''}><img src="${esc(p.thumb || '')}" alt=""${mv ? ` draggable="false" onclick="pickMove('${p.id}')"` : ` onclick="viewPhoto('${p.id}')"`}>
          ${canEdit && !mv ? `<button class="del" title="ลบรูป" onclick="delPhoto('${p.id}')">✕</button>` : ''}<div class="cap">${esc(th(p.time))}${p.by ? ' · ' + esc(p.by) : ''}</div></div>`).join('') + add + '</div>'
        + (list.length ? '' : '<div class="empty">ยังไม่มีรูป</div>')) + '</div>';
  }
  return h;
}
/* ---------- ผลตรวจ (super-admin) ---------- */
const REVIEW_TXT = { ok: 'ตรวจแล้ว', fix: 'ต้องแก้ไข', incomplete: 'ไม่สมบูรณ์' };
/** แท็บของสนาม: queue = รอตรวจ (ยังไม่ตรวจ หรือแก้ไขแล้วส่งรูปใหม่) · wait = รอผู้ประสานงานแก้ · done = ตรวจแล้ว */
function resent(d) { return !!(d.review && d.review !== 'ok' && d.lastPhoto && d.reviewAt && d.lastPhoto > d.reviewAt); }
function reviewTab(d) { if (d.review === 'ok') return 'done'; if (!d.review || resent(d)) return 'queue'; return 'wait'; }
function reviewPill(d) {
  if (!d.review) return '';
  return ` <span class="pill rv-${d.review}" title="${esc(d.reviewNote || '')}">${d.review === 'ok' ? '🔒 ' : ''}${REVIEW_TXT[d.review] || d.review}</span>` +
    (resent(d) ? ' <span class="pill rv-new" title="มีรูปใหม่หลังผลตรวจ">ส่งรูปใหม่แล้ว</span>' : '');
}
function renderTabs() {
  const c = { queue: 0, wait: 0, done: 0 };
  S.districts.forEach(d => c[reviewTab(d)]++);
  const tabs = [['queue', 'รอตรวจ', c.queue], ['wait', 'ต้องแก้ไข / ไม่สมบูรณ์', c.wait], ['done', 'ตรวจแล้ว', c.done], ['all', 'ทั้งหมด', S.districts.length]];
  document.getElementById('tabs').innerHTML = tabs.map(([k, t, n]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="S.tab='${k}';renderList()">${t}<b>${n}</b></button>`).join('');
}
function reviewPanel(d) {
  const cur = d.review ? `<div><span class="pill rv-${d.review}">${d.review === 'ok' ? '🔒 ' : ''}${REVIEW_TXT[d.review]}</span> <span class="empty">${esc(d.reviewBy || '')} ${d.reviewAt ? '· ' + esc(th(d.reviewAt)) : ''}</span></div>` +
    (d.reviewNote ? `<div style="margin-top:4px">หมายเหตุ: ${esc(d.reviewNote)}</div>` : '') + (resent(d) ? '<div class="rhint ok" style="margin-top:4px">ผู้ประสานงานส่งรูปใหม่หลังผลตรวจ · รอตรวจอีกครั้ง</div>' : '')
    : '<div class="empty">ยังไม่ได้ตรวจ</div>';
  const lock = d.locked ? '<div class="lockbar">🔒 ตรวจแล้ว · ปิดรับอัปโหลด/ลบรูปจากผู้ประสานงานและแอดมิน</div>' : '';
  if (S.role !== 'super') return `<div class="sec"><h3>ผลการตรวจ</h3><div class="rv">${cur}${lock}<div class="empty" style="margin-top:6px">เฉพาะผู้ตรวจ (super-admin) บันทึกผลตรวจได้</div></div></div>`;
  return `<div class="sec"><h3>ผลการตรวจ</h3><div class="rv">${cur}${lock}
    <textarea id="rvNote" placeholder="หมายเหตุถึงผู้ประสานงาน (แสดงในหน้าส่งรูป) เช่น ขั้น 3 รูปไม่ชัด ขอรูปใหม่">${esc(d.reviewNote || '')}</textarea>
    <div class="acts"><button class="btn sm rv-ok" onclick="setReview('${esc(d.code)}','ok',this)">✓ ตรวจแล้ว</button>
    <button class="btn sm rv-fix" onclick="setReview('${esc(d.code)}','fix',this)">ต้องแก้ไข</button>
    <button class="btn sm rv-incomplete" onclick="setReview('${esc(d.code)}','incomplete',this)">ไม่สมบูรณ์</button>
    ${d.review ? `<button class="btn ghost sm" onclick="setReview('${esc(d.code)}','',this)">ล้างผลตรวจ / ปลดล็อก</button>` : ''}</div>
    <div class="empty" style="margin-top:6px">"ตรวจแล้ว" จะปิดไม่ให้ผู้ประสานงานและแอดมินอัปโหลดหรือลบรูปของสนามนี้ (ผู้ตรวจยังแก้ได้)</div></div></div>`;
}
async function setReview(code, status, btn) {
  const venue = curVenue(code);
  const note = (document.getElementById('rvNote') || {}).value || '';
  if (status === 'ok' && !confirm('ยืนยัน "ตรวจแล้ว" ' + code + ' ' + venue + '?\nระบบจะปิดรับอัปโหลด/ลบรูปของสนามนี้')) return;
  if ((status === 'fix' || status === 'incomplete') && !note.trim() && !confirm('ยังไม่ได้ใส่หมายเหตุ ผู้ประสานงานจะไม่รู้ว่าต้องแก้อะไร · บันทึกต่อไหม?')) return;
  if (status === '' && !confirm('ล้างผลตรวจและปลดล็อกสนามนี้?')) return;
  btn.disabled = true;
  try {
    const j = await api('review', { d: code, v: venue, status, note: status ? note : '' }, true);
    const row = S.districts.find(x => x.code === code && String(x.venue || '').trim() === String(venue).trim());
    if (row) ['review', 'reviewNote', 'reviewBy', 'reviewAt', 'locked'].forEach(k => row[k] = j.district[k]);
    renderList();
    openDistrict(code, encodeURIComponent(venue));
  } catch (e) { alert(e.message); btn.disabled = false; }
}

/* ---------- เลือกไฟล์ดาวน์โหลด (หลายไฟล์รวมเป็น ZIP) ---------- */
const DL_ITEMS = [
  { id: 'rp', label: 'รายงานวันที่ 14–15 (PDF)', q: {}, kind: 'pdf' },
  { id: 'rw', label: 'รายงานวันที่ 14–15 (Word)', q: { format: 'docx' }, kind: 'docx' },
  { id: 'sp', label: 'ห้องมั่นคง (PDF)', q: { doc: 'secure' }, kind: 'pdf' },
  { id: 'sw', label: 'ห้องมั่นคง (Word)', q: { doc: 'secure', format: 'docx' }, kind: 'docx' }
];
const MIME = { pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
function chooseDownload(code) {
  const venue = curVenue(code);
  const el = document.createElement('div'); el.className = 'form';
  el.innerHTML = `<div class="box dl"><h3 style="margin:0 0 4px">ดาวน์โหลดไฟล์ · ${esc(code)} ${esc(venue)}</h3>
    <div class="empty" style="margin-bottom:6px">เลือกได้หลายไฟล์ · ถ้าเลือกมากกว่า 1 ไฟล์ จะรวมเป็น ZIP ไฟล์เดียว</div>
    ${DL_ITEMS.map(x => `<label><input type="checkbox" value="${x.id}" ${x.id === 'rp' ? 'checked' : ''}> ${x.label}</label>`).join('')}
    <div class="empty" id="dlMsg" style="margin-top:8px"></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn ghost" id="dlCancel">ปิด</button><button class="btn" id="dlGo">ดาวน์โหลด</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#dlCancel').onclick = () => el.remove();
  el.querySelector('#dlGo').onclick = async function () {
    const pick = [...el.querySelectorAll('input:checked')].map(i => DL_ITEMS.find(x => x.id === i.value));
    if (!pick.length) return el.querySelector('#dlMsg').textContent = 'เลือกอย่างน้อย 1 ไฟล์';
    const b = this; b.disabled = true;
    const msg = el.querySelector('#dlMsg'); const got = [];
    try {
      for (let i = 0; i < pick.length; i++) {
        msg.textContent = `กำลังสร้าง ${pick[i].label} (${i + 1}/${pick.length}) · ไฟล์ละประมาณ 5–20 วินาที`;
        const j = await api('pdf', Object.assign({ d: code, v: venue }, pick[i].q));
        got.push({ name: j.name, bytes: b64ToBytes(j[pick[i].kind]), type: MIME[pick[i].kind] });
      }
      if (got.length === 1) saveBlob(new Blob([got[0].bytes], { type: got[0].type }), got[0].name);
      else {
        msg.textContent = 'กำลังรวมเป็น ZIP…';
        await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
        const zip = new JSZip(); got.forEach(f => zip.file(f.name, f.bytes));
        const base = got[0].name.replace(/\.(pdf|docx)$/, '').replace(/_ห้องมั่นคง$/, '');
        saveBlob(await zip.generateAsync({ type: 'blob' }), base + '.zip');
      }
      el.remove();
    } catch (e) { msg.textContent = e.message; b.disabled = false; }
  };
}

/* ขั้นที่ใส่ในรายงาน PDF/Word (รับ/ส่ง 14 และ 15 พ.ย.) แนะนำข้อละ 1–2 รูป · ขั้นอื่นไม่แสดงคำแนะนำ */
const REPORT_STEPS = [3, 4, 5, 6], REPORT_MIN = 1, REPORT_MAX = 2;
function reportHint(n, count) {
  if (!REPORT_STEPS.includes(n)) return '';
  if (count > REPORT_MAX) return `<div class="rhint warn">มี ${count} รูป · แนะนำให้ลบให้เหลือ ${REPORT_MIN}–${REPORT_MAX} รูป (กด ✕ ที่รูปที่ไม่ใช้)</div>`;
  if (count < REPORT_MIN) return `<div class="rhint warn">ควรมีอย่างน้อย ${REPORT_MIN} รูป (ไม่เกิน ${REPORT_MAX} รูป)</div>`;
  return `<div class="rhint ok">✓ ${count} รูป · จำนวนเหมาะสม (${REPORT_MIN}–${REPORT_MAX} รูป)</div>`;
}
async function resetOwners(code) {
  if (!confirm('ล้างบัญชีไลน์ที่ผูกกับเขต ' + code + '? (ใช้เมื่อมีคนเลือกเขตผิด หรือเปลี่ยนผู้ประสานงาน รูปเดิมไม่หาย)')) return;
  try { await api('admin_set', { d: code, resetOwners: '1' }, true); await load(true); openDistrict(code); } catch (e) { alert(e.message); }
}
function closeDrawer() { document.getElementById('drawer').classList.remove('on'); S.cur = null; }

async function viewPhoto(id) {
  const p = S.cur && S.cur.photos && S.cur.photos.find(x => x.id === id); if (!p) return;
  const v = document.getElementById('viewer'), im = document.getElementById('vImg');
  im.src = p.thumb || '';
  document.getElementById('vCap').textContent = `ขั้นที่ ${p.step} · ${th(p.time)}${p.by ? ' · ' + p.by : ''}`;
  v.classList.add('on');
  try { if (!p.full) p.full = (await api('image', { id })).image; if (v.classList.contains('on')) im.src = p.full; } catch (e) { }
}
function closeViewer() { document.getElementById('viewer').classList.remove('on'); }
/* ---------- แคชรูปต่อสนาม: เปิดซ้ำแสดงทันที ลบ/เพิ่มรูปแล้วไม่ต้องโหลดทั้งหน้าใหม่ ---------- */
const PCACHE = {};
function toast(m, ms) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }

}
function rowOf(code, venue) { return S.districts.find(x => x.code === code && String(x.venue || '').trim() === String(venue || '').trim()); }
function nowLocal() { const n = new Date(); return new Date(n - n.getTimezoneOffset() * 60000).toISOString().slice(0, 19); }
function bumpCount(code, venue, step, delta, touch) {

  r.counts = r.counts || {}; r.counts[step] = Math.max(0, (r.counts[step] || 0) + delta);
  if (delta > 0 && touch !== false) r.lastPhoto = nowLocal();
}

async function movePhoto(id, step) {

function b64ToBytes(b64) { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function saveBlob(blob, name) {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);

async function exportPdf(mode, one) {
  const items = mode === 'one' ? [{ code: one, venue: curVenue(one) }]
    : [...S.sel].sort().map(k => { const i = k.indexOf('|'); return { code: k.slice(0, i), venue: k.slice(i + 1) }; });
  if (!items.length) return;
  const codes = items.map(it => it.code + (it.venue ? ' ' + it.venue : ''));
  const incomplete = items.filter(it => { const d = rowOf(it.code, it.venue); return !d || statusOf(d) !== 'ok'; });
  if (mode !== 'one' && incomplete.length && !confirm(`${incomplete.length} สนามยังส่งรูปไม่ครบ ${S.steps.length} ขั้น จะส่งออกเท่าที่มีหรือไม่?`)) return;
  S.busy = true; S.cancel = false;
  const log = document.getElementById('mLog'), bar = document.getElementById('mBar'), txt = document.getElementById('mText');
  log.innerHTML = ''; bar.style.width = '0'; document.getElementById('mBtn').textContent = 'ยกเลิก';
  modal(true, mode === 'one' ? 'กำลังสร้าง PDF' : `กำลังส่งออก PDF ${codes.length} สนาม`);
  const got = [];
  try {
    if (mode === 'merge') await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
    if (mode === 'zip') await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    for (let i = 0; i < codes.length && !S.cancel; i++) {
      txt.textContent = `${codes[i]} (${i + 1}/${codes.length}) · สนามที่สร้างไว้แล้วและไม่มีรูปใหม่จะเร็วขึ้น`;
      try {
        const j = await api('pdf', { d: items[i].code, v: items[i].venue });
        got.push({ code: codes[i], name: j.name, bytes: b64ToBytes(j.pdf) });
      } catch (e) { log.insertAdjacentHTML('beforeend', `<div>✕ ${esc(codes[i])}: ${esc(e.message)}</div>`); }
      bar.style.width = ((i + 1) / codes.length * 100) + '%';
    }
    if (!got.length) throw new Error('ไม่มีไฟล์ที่สร้างสำเร็จ');
    const stamp = new Date().toLocaleDateString('th-TH').replace(/\//g, '-');
    if (mode === 'one') saveBlob(new Blob([got[0].bytes], { type: 'application/pdf' }), got[0].name);
    else if (mode === 'merge') {
      txt.textContent = 'กำลังรวมไฟล์…';
      const out = await PDFLib.PDFDocument.create();
      for (const g of got) {
        const src = await PDFLib.PDFDocument.load(g.bytes);
        (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
      }
      saveBlob(new Blob([await out.save()], { type: 'application/pdf' }), `รูปรายงาน_ว14_รวม${got.length}สนาม_${stamp}.pdf`);
    } else {
      txt.textContent = 'กำลังทำไฟล์ ZIP…';
      const zip = new JSZip(); got.forEach(g => zip.file(g.name, g.bytes));
      saveBlob(await zip.generateAsync({ type: 'blob' }), `รูปรายงาน_ว14_${got.length}สนาม_${stamp}.zip`);
    }
    txt.textContent = (S.cancel ? 'ยกเลิกแล้ว · ' : '') + `ส่งออกสำเร็จ ${got.length}/${codes.length} สนาม`;
  } catch (e) { txt.textContent = e.message; }
  S.busy = false; document.getElementById('mBtn').textContent = 'ปิด';
  if (mode === 'one' && got.length) modal(false);
}

/* ---------- นำเข้ารายชื่อสนามสอบ (CSV: รหัสเขต,สนามสอบ) ---------- */
async function readCsvText(f) {
  const buf = await f.arrayBuffer();
  let txt;
  try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); }   // UTF-8 (แนะนำ)
  catch (e) { txt = new TextDecoder('windows-874').decode(buf); }         // Excel ภาษาไทยแบบเก่า (TIS-620/874)
  return txt.replace(/^﻿/, '');
}
function parseVenueCsv(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cells = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { cells.push(cur); cur = ''; }
      else cur += ch;
    }
    cells.push(cur);
    const code = cells[0].trim(), venue = (cells[1] || '').trim();
    if (/^รหัส/.test(code)) return; // บรรทัดหัวตาราง
    out.push([code, venue]);
  });
  return out;
}
function importVenues() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const rows = parseVenueCsv(await readCsvText(f)).filter(r => r[0] || r[1]);
      if (!rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
      if (!confirm('นำเข้า ' + rows.length + ' รายการสนามสอบจากไฟล์ ' + f.name + '\n\nรายการเดิมทั้งหมดจะถูกแทนที่ · เขตที่ไม่อยู่ในรายชื่อเขตจะทำให้นำเข้าไม่สำเร็จ\n\nดำเนินการต่อหรือไม่?')) return;
      const j = await api('admin_venues', { rows }, true);
      alert('นำเข้าแล้ว ' + j.count + ' สนาม ใน ' + j.districts + ' เขต');

}

function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('ไฟล์ไม่ใช่รูปภาพที่รองรับ')); };
    img.onload = () => {
      const max = CFG.MAX_EDGE || 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let thumb = '';
      for (const [edge, q] of [[320, 0.6], [240, 0.5], [180, 0.45]]) {
        const ts = Math.min(1, edge / Math.max(c.width, c.height)), t = document.createElement('canvas');
        t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts);
        t.getContext('2d').drawImage(c, 0, 0, t.width, t.height); thumb = t.toDataURL('image/jpeg', q);
        if (thumb.length < 45000) break;
      }
      ok({ image: c.toDataURL('image/jpeg', CFG.JPEG_QUALITY || 0.82), thumb });
    };
    img.src = url;
  });
}

    const o = el.querySelector('#pvOpen'); o.href = url; o.hidden = false;
    const dl = el.querySelector('#pvDl'); dl.hidden = false; dl.onclick = () => { close(); exportPdf('one', code); };
  } catch (e) { el.querySelector('#pvMsg').textContent = e.message; }
}

/* ---------- ลิงก์ประจำเขต ---------- */
async function exportLinks() {
  try {
    const j = await api('admin_links');
    const web = location.origin + location.pathname.replace(/admin\/?(index\.html)?$/, '');
    const liff = CFG.LIFF_ID ? `https://liff.line.me/${CFG.LIFF_ID}/photos/` : '';
    const rows = [['รหัส', 'เขตพื้นที่', 'ลิงก์เปิดในไลน์', 'ลิงก์สำรอง']].concat(j.links.map(l => {
      const q = `?d=${encodeURIComponent(l.code)}&v=${encodeURIComponent(l.venue)}&t=${l.t}`; return [l.code + ' ' + l.venue, l.name, liff ? liff + q : '', web + q];
    }));
    const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    saveBlob(new Blob([csv], { type: 'text/csv' }), 'ลิงก์ส่งรูปประจำเขต.csv');
  } catch (e) { alert(e.message); }
}

/* ---------- โหมดตัวอย่าง ---------- */
function demoApi(action, p) {
  const steps = [{ n: 2, title: 'การรับแบบทดสอบและกล่องกระดาษคำตอบ' }, { n: 3, title: 'ดำเนินการส่งแบบทดสอบฯ วันที่ 14 พ.ย.' },
    { n: 4, title: 'รับมอบกล่องกระดาษคำตอบ วันที่ 14 พ.ย.' }, { n: 5, title: 'รับมอบกล่องแบบทดสอบ วันที่ 14–15 พ.ย.' },
    { n: 6, title: 'ห้องมั่นคง' }, { n: 7, title: 'ส่งมอบศูนย์สอบธรรมศาสตร์' }];
  if (!S._demo) {
    const names = ['สพป. กระบี่', 'สพป. กาญจนบุรี เขต 2', 'สพป. กาญจนบุรี เขต 3', 'สพป. กาญจนบุรี เขต 4', 'สพม. ปัตตานี', 'สพป. นราธิวาส เขต 1', 'สศศ. (ภาคเหนือ)', 'สพป. ขอนแก่น เขต 1'];
    const regions = ['ใต้', 'ตะวันตก', 'ตะวันตก', 'ตะวันตก', 'ใต้ (ไกลมาก)', 'ใต้ (ไกลมาก)', 'เหนือตอนบน', 'อีสานตอนบน'];
    S._demo = names.map((n, i) => {
      const counts = {}; const k = [6, 3, 0, 6, 1, 0, 4, 2][i]; for (let s = 2; s < 2 + k; s++) counts[s] = 1 + (s % 3 === 0 ? 1 : 0);
      return { code: String(i + 1).padStart(3, '0'), name: n, region: regions[i], vehicle: 10 + i, venue: k ? 'โรงเรียนตัวอย่าง ' + (i + 1) : '',
        venues: ['โรงเรียนตัวอย่าง ' + (i + 1), 'โรงเรียนตัวอย่างสำรอง'], counts, pdfAllowed: i === 0, submittedAt: k === 6 && i === 0 ? new Date().toISOString() : '',
        lastPhoto: k ? new Date(Date.now() - i * 3.6e6).toISOString() : '' };
    });
  }
  return new Promise(r => setTimeout(r, 200)).then(() => {
    switch (action) {
      case 'admin_summary': return { districts: S._demo, steps, exportOpen: false };
      case 'admin_photos': {
        const d = S._demo.find(x => x.code === p.d); const photos = [];
        Object.entries(d.counts).forEach(([s, n]) => { for (let i = 0; i < n; i++) photos.push({ id: s + '-' + i, step: +s, time: d.lastPhoto, by: '', thumb: demoThumb(s) }); });
        return { district: d, photos };
      }
      case 'admin_set': return { exportOpen: p.exportOpen === '1' };
      case 'info': { const d = S._demo.find(x => x.code === p.d); if (!d.venues.includes(p.venue)) throw new Error('กรุณาเลือกสนามสอบจากรายการที่กำหนด'); d.venue = p.venue; return { district: d }; }
      case 'image': return { image: demoThumb(String(p.id).split('-')[0]) };
      default: throw new Error('โหมดตัวอย่างทำรายการนี้ไม่ได้ ต้องเชื่อม Apps Script ก่อน');
    }
  });
}
function demoThumb(s) {
  const c = document.createElement('canvas'); c.width = 240; c.height = 180; const g = c.getContext('2d');
  g.fillStyle = ['#8fb3d9', '#9ccfb0', '#e3c08d', '#c9a3d6', '#e39b9b', '#a9c1c9'][s % 6]; g.fillRect(0, 0, 240, 180);
  g.fillStyle = '#fff'; g.font = '600 22px Sarabun'; g.fillText('ขั้นที่ ' + s, 80, 95); return c.toDataURL('image/jpeg', .7);
}
