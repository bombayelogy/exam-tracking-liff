<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามการจัดส่งข้อสอบ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; padding: 20px; background-color: #f4f6f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1f2937; }
        label { font-weight: bold; margin-top: 15px; display: block; color: #4b5563; font-size: 14px; }
        select, input[type="text"], button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; box-sizing: border-box; }
        .checkbox-container { background: #fff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 16px; max-height: 200px; overflow-y: auto; }
        .checkbox-item { display: flex; align-items: center; margin-bottom: 8px; font-weight: normal; }
        .checkbox-item input { width: 20px; height: 20px; margin-right: 10px; margin-top: 0; }
        button { background-color: #00B900; color: white; border: none; font-weight: bold; margin-top: 25px; cursor: pointer; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .loading { text-align: center; color: #3b82f6; font-size: 16px; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📍 รายงานสถานะจัดส่ง</h2>
        <div id="loadingMessage" class="loading">⏳ กำลังโหลดข้อมูลระบบ...</div>
        
        <form id="trackerForm" style="display: none;">
            <label>หมายเลขรถ / สายทาง</label>
            <select id="carNo" required>
                <option value="">-- เลือกรถ --</option>
            </select>

            <label>รอบการเดินทาง</label>
            <select id="tripPhase" required>
                <option value="ขาไป (ส่งข้อสอบ)">ขาไป (ส่งข้อสอบ)</option>
                <option value="ขากลับ (รับกระดาษคำตอบ)">ขากลับ (รับกระดาษคำตอบ)</option>
            </select>

            <label>สถานที่เป้าหมาย (เลือกได้หลายที่)</label>
            <div id="targetPlaceContainer" class="checkbox-container">
                <span style="color: #9ca3af;">-- กรุณาเลือกรถก่อน --</span>
            </div>

            <label>สถานะปัจจุบัน</label>
            <select id="status" required>
                <option value="">-- เลือกสถานะ --</option>
            </select>

            <label>ปัญหา / เหตุขัดข้อง (ถ้ามี)</label>
            <input type="text" id="problem" placeholder="เช่น ฝนตกหนัก, รถติด, ยางรั่ว">

            <button type="submit" id="submitBtn">🚀 ส่งข้อมูลพิกัดและสถานะ</button>
        </form>
    </div>

    <script>
        // ใส่ลิงก์ Web App ของคุณเรียบร้อยแล้ว
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3trBi1uBeDMCWufXtEvENbvCO07HtQL4FkGIUJD0J2dMQnJeiFydZB_BruMBPQnBvoQ/exec"; 
        
        const LIFF_ID = "2011909530-beJI0GnK"; 
        let masterData = {};
        let displayName = "Unknown";

        async function main() {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                displayName = (await liff.getProfile()).displayName;
                fetchMasterData();
            } else {
                liff.login();
            }
        }
        main();

        function fetchMasterData() {
            fetch(WEB_APP_URL)
                .then(r => r.json())
                .then(data => {
                    masterData = data.cars; 
                    const carSelect = document.getElementById("carNo");
                    for (let car in masterData) {
                        carSelect.add(new Option(car, car));
                    }
                    const statusSelect = document.getElementById("status");
                    data.statuses.forEach(status => {
                        if(status) statusSelect.add(new Option(status, status));
                    });
                    document.getElementById("loadingMessage").style.display = "none";
                    document.getElementById("trackerForm").style.display = "block";
                }).catch(e => {
                    document.getElementById("loadingMessage").innerText = "❌ โหลดข้อมูลล้มเหลว";
                    document.getElementById("loadingMessage").style.color = "red";
                });
        }

        document.getElementById("carNo").addEventListener("change", function() {
            const selectedCar = this.value;
            const container = document.getElementById("targetPlaceContainer");
            container.innerHTML = ""; 
            
            if (selectedCar && masterData[selectedCar]) {
                masterData[selectedCar].forEach(place => {
                    let label = document.createElement("label");
                    label.className = "checkbox-item";
                    label.innerHTML = `<input type="checkbox" name="targetPlace" value="${place}"> ${place}`;
                    container.appendChild(label);
                });
            } else {
                container.innerHTML = '<span style="color: #9ca3af;">-- กรุณาเลือกรถก่อน --</span>';
            }
        });

        document.getElementById("trackerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            
            let selectedPlaces = [];
            document.querySelectorAll('input[name="targetPlace"]:checked').forEach(cb => {
                selectedPlaces.push(cb.value);
            });

            if(selectedPlaces.length === 0) {
                Swal.fire("แจ้งเตือน", "กรุณาติ๊กเลือกสถานที่เป้าหมายอย่างน้อย 1 แห่ง", "warning");
                return;
            }

            btn.disabled = true;
            btn.innerText = "📍 กำลังค้นหาพิกัด GPS...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => sendData(position.coords.latitude, position.coords.longitude, selectedPlaces),
                    (error) => {
                        Swal.fire("แจ้งเตือน", "กรุณาเปิด Location ในมือถือ", "warning");
                        btn.disabled = false;
                        btn.innerText = "🚀 ส่งข้อมูลพิกัดและสถานะ";
                    },
                    { enableHighAccuracy: true }
                );
            }
        });

        function sendData(lat, lng, selectedPlaces) {
            document.getElementById("submitBtn").innerText = "☁️ กำลังบันทึกข้อมูลลงระบบ...";
            
            const payload = {
                displayName: displayName,
                carNo: document.getElementById("carNo").value,
                tripPhase: document.getElementById("tripPhase").value,
                targetPlaces: selectedPlaces,
                status: document.getElementById("status").value,
                problem: document.getElementById("problem").value,
                lat: lat,
                lng: lng
            };

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(result => {
                if(result.status === "success") {
                    Swal.fire("สำเร็จ!", "บันทึกข้อมูลเรียบร้อย", "success").then(() => liff.closeWindow());
                } else throw new Error();
            })
            .catch(() => {
                Swal.fire("ข้อผิดพลาด", "บันทึกข้อมูลล้มเหลว", "error");
                document.getElementById("submitBtn").disabled = false;
                document.getElementById("submitBtn").innerText = "🚀 ส่งข้อมูลพิกัดและสถานะ";
            });
        }
    </script>
</body>
</html>
